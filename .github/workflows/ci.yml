name: Hospital SaaS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hospital-saas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET 10 build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies (keep NuGet vulnerability warnings visible)
        run: dotnet restore backend/HospitalSaaS.sln -p:WarningsNotAsErrors="NU1902;NU1903"

      - name: Dependency vulnerability report
        run: dotnet list backend/HospitalSaaS.sln package --vulnerable --include-transitive
        continue-on-error: true

      - name: Build
        run: dotnet build backend/HospitalSaaS.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test backend/HospitalSaaS.sln --configuration Release --no-build --logger "trx;LogFileName=hospital-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hospital-saas-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  frontend:
    name: Angular 19 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: hospital-saas-frontend
          path: frontend/dist/
          if-no-files-found: error
