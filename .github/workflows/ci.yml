name: Hospital SaaS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hospital-saas-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET 10 build and tests
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=HospitalSaaSDb;User Id=sa;Password=HospitalSaaS_CI_2026!Secure;Encrypt=False;TrustServerCertificate=True;"
      TEST_SQL_CONNECTION: "Server=localhost,1433;Database=HospitalSaaSDb;User Id=sa;Password=HospitalSaaS_CI_2026!Secure;Encrypt=False;TrustServerCertificate=True;"
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "HospitalSaaS_CI_2026!Secure"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'HospitalSaaS_CI_2026!Secure' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies (keep NuGet vulnerability warnings visible)
        run: dotnet restore backend/HospitalSaaS.sln -p:WarningsNotAsErrors=NU1902%3BNU1903

      - name: Dependency vulnerability report
        run: dotnet list backend/HospitalSaaS.sln package --vulnerable --include-transitive
        continue-on-error: true

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.10

      - name: Apply database migrations
        run: dotnet ef database update --project backend/src/HospitalSaaS.Infrastructure/HospitalSaaS.Infrastructure.csproj --startup-project backend/src/HospitalSaaS.Api/HospitalSaaS.Api.csproj --configuration Release

      - name: Build
        run: dotnet build backend/HospitalSaaS.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test backend/HospitalSaaS.sln --configuration Release --no-build --logger "trx;LogFileName=hospital-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hospital-saas-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  frontend:
    name: Angular 19 build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: hospital-saas-frontend
          path: frontend/dist/
          if-no-files-found: error
